<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>O Universo da Inteligência Artificial — Valorian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --marfim:#F7F3EB;
    --marfim-2:#FDFBF6;
    --navy-900:#0A1F33;
    --navy-800:#13293D;
    --navy-100:#E4E9EA;
    --navy-200:#C6D2DA;
    --navy-400:#6F8499;
    --navy-600:#33506B;
    --pedra:#C2C9D1;
    --grafite:#4A4F55;
    --dourado:#C9A227;
    --dourado-100:#F1E8D0;
    --muted:#5A6B7C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--marfim);font-family:'Inter',Arial,sans-serif;color:var(--navy-800);}
  .topbar{
    background:var(--navy-900);color:var(--marfim);
    padding:10px 20px;text-align:center;
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1.5px;
    border-bottom:3px solid var(--dourado);
  }
  .topbar b{color:var(--dourado);}
  .wrap{max-width:1920px;margin:0 auto;position:relative;}

  /* ===== ZOOM / PAN ===== */
  .zoom-stage{
    position:relative; width:100%; aspect-ratio:1920/2300;
    overflow:hidden; touch-action:none; cursor:grab;
    background:var(--marfim); border-bottom:1px solid #E7E2D5;
  }
  .zoom-stage.panning{cursor:grabbing;}
  .zoom-inner{position:absolute; top:0; left:0; width:100%; height:100%;}
  svg#chart{display:block; width:100%; height:100%;}

  #zoom-controls{
    position:fixed; right:18px; bottom:18px; z-index:50;
    display:flex; flex-direction:column; gap:6px;
    background:var(--navy-900); padding:6px; border-radius:14px;
    box-shadow:0 8px 22px rgba(10,31,51,.3); border:1px solid var(--dourado);
  }
  #zoom-controls button{
    width:38px; height:38px; border-radius:9px; border:none;
    background:rgba(247,243,235,.1); color:var(--marfim);
    font-size:18px; font-family:'Inter',sans-serif; font-weight:600;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .15s;
  }
  #zoom-controls button:hover{background:var(--dourado); color:var(--navy-900);}
  #zoom-reset{font-size:15px;}

  /* pills interativas */
  .tech{cursor:pointer;}
  .tech rect{transition:transform .15s ease, filter .15s ease, stroke-width .15s ease;}
  .tech text{pointer-events:none;}
  .tech:hover rect, .tech:focus-visible rect{
    filter:drop-shadow(0 3px 8px rgba(10,31,51,0.35));
    stroke-width:2.4;
  }
  .tech:focus-visible{outline:none;}
  .tech:focus-visible rect{stroke:var(--dourado); stroke-width:2.6;}
  .tech-gold:hover rect, .tech-gold:focus-visible rect{filter:drop-shadow(0 3px 10px rgba(201,162,39,0.55));}

  .catalog-cta{cursor:pointer;}
  .catalog-cta rect{transition:filter .15s ease, fill .15s ease;}
  .catalog-cta:hover rect, .catalog-cta:focus-visible rect{
    filter:drop-shadow(0 4px 14px rgba(201,162,39,.5));
  }
  .catalog-cta:focus-visible{outline:none;}

  /* hint flutuante */
  .hint{
    position:absolute; left:50%; transform:translateX(-50%);
    top:172px;
    background:var(--navy-900); color:var(--marfim);
    font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.5px;
    padding:7px 16px; border-radius:20px; border:1px solid var(--dourado);
    box-shadow:0 6px 18px rgba(10,31,51,.25);
    pointer-events:none; opacity:.95; z-index:5;
  }

  /* ===== MODAL ===== */
  #backdrop{
    position:fixed; inset:0; background:rgba(10,31,51,.55);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center;
    z-index:100; padding:24px;
  }
  #backdrop.open{display:flex;}
  #card{
    background:var(--marfim-2); width:100%; max-width:520px; max-height:86vh;
    border-radius:18px; overflow:hidden;
    box-shadow:0 24px 60px rgba(10,31,51,.45);
    display:flex; flex-direction:column;
    animation:pop .18s ease;
  }
  @keyframes pop{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
  #card-head{
    background:var(--navy-900); padding:22px 26px 18px; position:relative;
    border-bottom:3px solid var(--dourado);
  }
  #card-close{
    position:absolute; top:14px; right:14px;
    width:32px; height:32px; border-radius:50%;
    background:rgba(247,243,235,.12); border:none; color:var(--marfim);
    font-size:18px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #card-close:hover{background:rgba(247,243,235,.24);}
  #card-eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:1.8px;
    color:var(--dourado); text-transform:uppercase; margin:0 0 6px;
  }
  #card-title{
    font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:24px;
    color:var(--marfim); margin:0; line-height:1.15; padding-right:36px;
  }
  #card-era{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--marfim);
    opacity:.65; margin-top:8px;
  }
  #card-techniques{
    font-size:12px; color:var(--marfim); margin-top:8px; line-height:1.4;
  }
  #card-techniques b{color:var(--dourado); font-weight:600;}
  #card-body{padding:22px 26px 8px; overflow-y:auto;}
  #card-status{
    display:inline-flex; align-items:center; gap:7px;
    padding:6px 14px; border-radius:20px; font-size:12px; font-weight:600;
    margin-bottom:16px;
  }
  #card-status .dot{width:8px; height:8px; border-radius:50%;}
  .status-ativa{background:var(--dourado-100); color:#7A5E10; border:1px solid var(--dourado);}
  .status-ativa .dot{background:var(--dourado);}
  .status-nicho{background:var(--navy-100); color:var(--navy-800); border:1px solid var(--navy-400);}
  .status-nicho .dot{background:var(--navy-400);}
  .status-historica{background:#EDEBE6; color:var(--grafite); border:1px solid #A9AEB3;}
  .status-historica .dot{background:#8A8F94;}
  .status-fronteira{background:var(--marfim-2); color:var(--navy-800); border:1.5px dashed var(--dourado);}
  .status-fronteira .dot{background:var(--navy-800); box-shadow:0 0 0 3px var(--dourado-100);}
  .status-obra{background:#F0E6D2; color:#6B4E23; border:1px solid #B8956A;}
  .status-obra .dot{background:#B8956A;}

  #card-desc{font-size:15px; line-height:1.55; color:var(--navy-800); margin:0 0 18px;}
  #card-uses h4{
    font-family:'Inter',sans-serif; font-size:11px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--muted); margin:0 0 10px; font-weight:700;
  }
  #card-uses ul{margin:0 0 6px; padding:0; list-style:none;}
  #card-uses li{
    position:relative; padding:0 0 10px 20px; font-size:14px; line-height:1.45; color:var(--navy-800);
  }
  #card-uses li:before{
    content:"›"; position:absolute; left:0; top:-2px; color:var(--dourado); font-weight:700; font-size:17px;
  }
  #card-foot{
    padding:14px 26px 20px; font-size:11px; color:var(--muted); font-style:italic;
    border-top:1px solid #E7E2D5;
  }

  @media (max-width: 640px){
    #card-title{font-size:20px;}
    .hint{font-size:10px; padding:6px 12px; top:150px;}
  }

</style>
</head>
