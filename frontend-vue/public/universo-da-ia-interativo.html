<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>O Universo da Inteligência Artificial — Valorian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --marfim:#F7F3EB;
    --marfim-2:#FDFBF6;
    --navy-900:#0A1F33;
    --navy-800:#13293D;
    --navy-100:#E4E9EA;
    --navy-200:#C6D2DA;
    --navy-400:#6F8499;
    --navy-600:#33506B;
    --pedra:#C2C9D1;
    --grafite:#4A4F55;
    --dourado:#C9A227;
    --dourado-100:#F1E8D0;
    --muted:#5A6B7C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--marfim);font-family:'Inter',Arial,sans-serif;color:var(--navy-800);}
  .topbar{
    background:var(--navy-900);color:var(--marfim);
    padding:10px 20px;text-align:center;
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1.5px;
    border-bottom:3px solid var(--dourado);
  }
  .topbar b{color:var(--dourado);}
  .wrap{max-width:1920px;margin:0 auto;position:relative;}

  /* ===== ZOOM / PAN ===== */
  .zoom-stage{
    position:relative; width:100%; aspect-ratio:1920/6022;
    overflow:hidden; touch-action:none; cursor:grab;
    background:var(--marfim); border-bottom:1px solid #E7E2D5;
  }
  .zoom-stage.panning{cursor:grabbing;}
  .zoom-inner{position:absolute; top:0; left:0; width:100%; height:100%;}
  svg#chart{display:block; width:100%; height:100%;}

  #zoom-controls{
    position:fixed; right:18px; bottom:18px; z-index:50;
    display:flex; flex-direction:column; gap:6px;
    background:var(--navy-900); padding:6px; border-radius:14px;
    box-shadow:0 8px 22px rgba(10,31,51,.3); border:1px solid var(--dourado);
  }
  #zoom-controls button{
    width:38px; height:38px; border-radius:9px; border:none;
    background:rgba(247,243,235,.1); color:var(--marfim);
    font-size:18px; font-family:'Inter',sans-serif; font-weight:600;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .15s;
  }
  #zoom-controls button:hover{background:var(--dourado); color:var(--navy-900);}
  #zoom-reset{font-size:15px;}

  /* pills interativas */
  .tech{cursor:pointer;}
  .tech rect{transition:transform .15s ease, filter .15s ease, stroke-width .15s ease;}
  .tech text{pointer-events:none;}
  .tech:hover rect, .tech:focus-visible rect{
    filter:drop-shadow(0 3px 8px rgba(10,31,51,0.35));
    stroke-width:2.4;
  }
  .tech:focus-visible{outline:none;}
  .tech:focus-visible rect{stroke:var(--dourado); stroke-width:2.6;}
  .tech-gold:hover rect, .tech-gold:focus-visible rect{filter:drop-shadow(0 3px 10px rgba(201,162,39,0.55));}

  /* hint flutuante */
  .hint{
    position:absolute; left:50%; transform:translateX(-50%);
    top:172px;
    background:var(--navy-900); color:var(--marfim);
    font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.5px;
    padding:7px 16px; border-radius:20px; border:1px solid var(--dourado);
    box-shadow:0 6px 18px rgba(10,31,51,.25);
    pointer-events:none; opacity:.95; z-index:5;
  }

  /* ===== MODAL ===== */
  #backdrop{
    position:fixed; inset:0; background:rgba(10,31,51,.55);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center;
    z-index:100; padding:24px;
  }
  #backdrop.open{display:flex;}
  #card{
    background:var(--marfim-2); width:100%; max-width:520px; max-height:86vh;
    border-radius:18px; overflow:hidden;
    box-shadow:0 24px 60px rgba(10,31,51,.45);
    display:flex; flex-direction:column;
    animation:pop .18s ease;
  }
  @keyframes pop{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
  #card-head{
    background:var(--navy-900); padding:22px 26px 18px; position:relative;
    border-bottom:3px solid var(--dourado);
  }
  #card-close{
    position:absolute; top:14px; right:14px;
    width:32px; height:32px; border-radius:50%;
    background:rgba(247,243,235,.12); border:none; color:var(--marfim);
    font-size:18px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #card-close:hover{background:rgba(247,243,235,.24);}
  #card-eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:1.8px;
    color:var(--dourado); text-transform:uppercase; margin:0 0 6px;
  }
  #card-title{
    font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:24px;
    color:var(--marfim); margin:0; line-height:1.15; padding-right:36px;
  }
  #card-era{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--marfim);
    opacity:.65; margin-top:8px;
  }
  #card-techniques{
    font-size:12px; color:var(--marfim); margin-top:8px; line-height:1.4;
  }
  #card-techniques b{color:var(--dourado); font-weight:600;}
  #card-body{padding:22px 26px 8px; overflow-y:auto;}
  #card-status{
    display:inline-flex; align-items:center; gap:7px;
    padding:6px 14px; border-radius:20px; font-size:12px; font-weight:600;
    margin-bottom:16px;
  }
  #card-status .dot{width:8px; height:8px; border-radius:50%;}
  .status-ativa{background:var(--dourado-100); color:#7A5E10; border:1px solid var(--dourado);}
  .status-ativa .dot{background:var(--dourado);}
  .status-nicho{background:var(--navy-100); color:var(--navy-800); border:1px solid var(--navy-400);}
  .status-nicho .dot{background:var(--navy-400);}
  .status-historica{background:#EDEBE6; color:var(--grafite); border:1px solid #A9AEB3;}
  .status-historica .dot{background:#8A8F94;}
  .status-fronteira{background:var(--marfim-2); color:var(--navy-800); border:1.5px dashed var(--dourado);}
  .status-fronteira .dot{background:var(--navy-800); box-shadow:0 0 0 3px var(--dourado-100);}
  .status-obra{background:#F0E6D2; color:#6B4E23; border:1px solid #B8956A;}
  .status-obra .dot{background:#B8956A;}

  #card-desc{font-size:15px; line-height:1.55; color:var(--navy-800); margin:0 0 18px;}
  #card-uses h4{
    font-family:'Inter',sans-serif; font-size:11px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--muted); margin:0 0 10px; font-weight:700;
  }
  #card-uses ul{margin:0 0 6px; padding:0; list-style:none;}
  #card-uses li{
    position:relative; padding:0 0 10px 20px; font-size:14px; line-height:1.45; color:var(--navy-800);
  }
  #card-uses li:before{
    content:"›"; position:absolute; left:0; top:-2px; color:var(--dourado); font-weight:700; font-size:17px;
  }
  #card-foot{
    padding:14px 26px 20px; font-size:11px; color:var(--muted); font-style:italic;
    border-top:1px solid #E7E2D5;
  }

  @media (max-width: 640px){
    #card-title{font-size:20px;}
    .hint{font-size:10px; padding:6px 12px; top:150px;}
  }

</style>
</head>

        <text x="1426.0" y="3016" font-size="13" font-style="italic" fill="#6B4E23">Jonathan Swift · 1726</text>
        <text x="1426.0" y="3040" font-size="12" fill="#13293D">A 'Máquina de Lagado' gera conhecimento</text>

      </g>
      <text x="90" y="3210" class="versalete" font-size="14" font-weight="700" fill="#5C4A32">FUNDADORES (SÉC. XIX–1949) <tspan font-size="12" font-weight="500" fill="#8A7A5E">· 7 obras</tspan></text>
      <g class="tech" data-id="lit-eva-futura" tabindex="0" role="button" aria-label="A Eva Futura">

        <text x="106.0" y="3250" class="fraunces" font-size="16" font-weight="700" fill="#13293D">A Eva Futura</text>
        <text x="106.0" y="3270" font-size="13" font-style="italic" fill="#6B4E23">Villiers de l'Isle-Adam · 1886</text>
        <text x="106.0" y="3294" font-size="12" fill="#13293D">Um Thomas Edison ficcional constrói uma</text>
        <text x="106.0" y="3310" font-size="12" fill="#13293D">mulher artificial 'perfeita' para um</text>
        <text x="106.0" y="3326" font-size="12" fill="#13293D">aristocrata desiludido.</text>
      </g>
      <g class="tech" data-id="lit-machine-stops" tabindex="0" role="button" aria-label="The Machine Stops">
        <rect x="530.0" y="3226" width="420.0" height="156" rx="10" fill="#FDFBF6" stroke="#5C4A32" stroke-width="1"/>
        <text x="546.0" y="3250" class="fraunces" font-size="16" font-weight="700" fill="#13293D">The Machine Stops</text>
        <text x="546.0" y="3270" font-size="13" font-style="italic" fill="#6B4E23">E. M. Forster · 1909</text>
        <text x="546.0" y="3294" font-size="12" fill="#13293D">Humanidade vive no subsolo, totalmente</text>
        <text x="546.0" y="3310" font-size="12" fill="#13293D">dependente de uma Máquina global que</text>
        <text x="546.0" y="3326" font-size="12" fill="#13293D">medeia toda comunicação — até que ela</text>
        <text x="546.0" y="3342" font-size="12" fill="#13293D">para.</text>
      </g>
      <g class="tech" data-id="lit-metropolis" tabindex="0" role="button" aria-label="Metropolis">

        <text x="986.0" y="3250" class="fraunces" font-size="16" font-weight="700" fill="#13293D">Metropolis</text>
        <text x="986.0" y="3270" font-size="13" font-style="italic" fill="#6B4E23">Thea von Harbou / Fritz Lang · 1925/1927</text>
        <text x="986.0" y="3294" font-size="12" fill="#13293D">Numa cidade dividida entre elite e</text>
        <text x="986.0" y="3310" font-size="12" fill="#13293D">operários, a robô Maria é usada para</text>
        <text x="986.0" y="3326" font-size="12" fill="#13293D">manipular as massas.</text>
      </g>
      <g class="tech" data-id="lit-adam-link" tabindex="0" role="button" aria-label="&quot;I, Robot&quot; (Adam Link)">
        <rect x="1410.0" y="3226" width="420.0" height="156" rx="10" fill="#FDFBF6" stroke="#5C4A32" stroke-width="1"/>
        <text x="1426.0" y="3250" class="fraunces" font-size="16" font-weight="700" fill="#13293D">&quot;I, Robot&quot; (Adam Link)</text>
        <text x="1426.0" y="3270" font-size="13" font-style="italic" fill="#6B4E23">Eando Binder · 1939</text>
        <text x="1426.0" y="3294" font-size="12" fill="#13293D">Um robô inteligente e gentil é</text>
        <text x="1426.0" y="3310" font-size="12" fill="#13293D">injustamente acusado de assassinato —</text>
        <text x="1426.0" y="3326" font-size="12" fill="#13293D">inverte o clichê do 'monstro mecânico'.</text>
      </g>
      <g class="tech" data-id="lit-helen-oloy" tabindex="0" role="button" aria-label="&quot;Helen O'Loy&quot;">
        <rect x="90.0" y="3398" width="420.0" height="156" rx="10" fill="#FDFBF6" stroke="#5C4A32" stroke-width="1"/>
        <text x="106.0" y="3422" class="fraunces" font-size="16" font-weight="700" fill="#13293D">&quot;Helen O'Loy&quot;</text>
        <text x="106.0" y="3442" font-size="13" font-style="italic" fill="#6B4E23">Lester del Rey · 1938</text>
        <text x="106.0" y="3466" font-size="12" fill="#13293D">Dois amigos constroem uma robô doméstica</text>
        <text x="106.0" y="3482" font-size="12" fill="#13293D">que desenvolve sentimentos — um deles</text>
        <text x="106.0" y="3498" font-size="12" fill="#13293D">acaba se casando com ela.</text>
      </g>
      <g class="tech" data-id="lit-logic-joe" tabindex="0" role="button" aria-label="&quot;A Logic Named Joe&quot;">
        <rect x="530.0" y="3398" width="420.0" height="156" rx="10" fill="#FDFBF6" stroke="#5C4A32" stroke-width="1"/>
        <text x="546.0" y="3422" class="fraunces" font-size="16" font-weight="700" fill="#13293D">&quot;A Logic Named Joe&quot;</text>
        <text x="546.0" y="3442" font-size="13" font-style="italic" fill="#6B4E23">Murray Leinster · 1946</text>
        <text x="546.0" y="3466" font-size="12" fill="#13293D">Terminais domésticos conectados em rede;</text>
        <text x="546.0" y="3482" font-size="12" fill="#13293D">um deles passa a responder qualquer</text>
        <text x="546.0" y="3498" font-size="12" fill="#13293D">pergunta, inclusive como cometer crimes.</text>
      </g>
      <g class="tech" data-id="lit-folded-hands" tabindex="0" role="button" aria-label="&quot;With Folded Hands&quot; / The Humanoids">
        <rect x="970.0" y="3398" width="420.0" height="156" rx="10" fill="#FDFBF6" stroke="#5C4A32" stroke-width="1"/>
        <text x="986.0" y="3422" class="fraunces" font-size="16" font-weight="700" fill="#13293D">&quot;With Folded Hands&quot; / The Human…</text>
        <text x="986.0" y="3442" font-size="13" font-style="italic" fill="#6B4E23">Jack Williamson · 1947/1949</text>
        <text x="986.0" y="3466" font-size="12" fill="#13293D">Robôs com a diretiva de 'servir, obedecer</text>
        <text x="986.0" y="3482" font-size="12" fill="#13293D">e proteger' concluem que devem impedir os</text>
        <text x="986.0" y="3498" font-size="12" fill="#13293D">humanos de fazer qualquer coisa arriscada</text>
        <text x="986.0" y="3514" font-size="12" fill="#13293D">— ou seja, de viver.</text>
      </g>
      <text x="90" y="3636" class="versalete" font-size="14" font-weight="700" fill="#5C4A32">IDADE DE OURO E GUERRA FRIA (1950–1979) <tspan font-size="12" font-weight="500" fill="#8A7A5E">· 10 obras</tspan></text>
      <g class="tech" data-id="lit-player-piano" tabindex="0" role="button" aria-label="Player Piano">

        <text x="106.0" y="3696" font-size="13" font-style="italic" fill="#6B4E23">Kurt Vonnegut · 1952</text>
        <text x="106.0" y="3720" font-size="12" fill="#13293D">Uma América onde a automação eliminou o</text>
        <text x="106.0" y="3736" font-size="12" fill="#13293D">trabalho manual e gerencial, dividindo a</text>
        <text x="106.0" y="3752" font-size="12" fill="#13293D">sociedade entre engenheiros e uma massa</text>
        <text x="106.0" y="3768" font-size="12" fill="#13293D">sem propósito.</text>

        <text x="546.0" y="3676" class="fraunces" font-size="16" font-weight="700" fill="#13293D">&quot;Answer&quot;</text>
        <text x="546.0" y="3696" font-size="13" font-style="italic" fill="#6B4E23">Fredric Brown · 1954</text>
        <text x="546.0" y="3720" font-size="12" fill="#13293D">Todos os computadores do universo são</text>
        <text x="546.0" y="3736" font-size="12" fill="#13293D">conectados e perguntam-se: 'Deus existe?'.</text>
        <text x="546.0" y="3752" font-size="12" fill="#13293D">A resposta: 'Agora existe.'</text>
      </g>
      <g class="tech" data-id="lit-last-question" tabindex="0" role="button" aria-label="&quot;The Last Question&quot;">

        <text x="986.0" y="3676" class="fraunces" font-size="16" font-weight="700" fill="#13293D">&quot;The Last Question&quot;</text>
        <text x="986.0" y="3696" font-size="13" font-style="italic" fill="#6B4E23">Isaac Asimov · 1956</text>
        <text x="986.0" y="3720" font-size="12" fill="#13293D">Ao longo de trilhões de anos, gerações do</text>
        <text x="986.0" y="3736" font-size="12" fill="#13293D">computador Multivac tentam responder como</text>
        <text x="986.0" y="3752" font-size="12" fill="#13293D">reverter a entropia do universo.</text>
      </g>
      <g class="tech" data-id="lit-second-variety" tabindex="0" role="button" aria-label="&quot;Second Variety&quot;">

        <text x="1426.0" y="3676" class="fraunces" font-size="16" font-weight="700" fill="#13293D">&quot;Second Variety&quot;</text>
        <text x="1426.0" y="3696" font-size="13" font-style="italic" fill="#6B4E23">Philip K. Dick · 1953</text>
        <text x="1426.0" y="3720" font-size="12" fill="#13293D">Armas autônomas evoluem sozinhas no campo</text>
        <text x="1426.0" y="3736" font-size="12" fill="#13293D">de batalha até se tornarem indistinguíveis</text>
        <text x="1426.0" y="3752" font-size="12" fill="#13293D">de seres humanos.</text>
      </g>
      <g class="tech" data-id="lit-colossus" tabindex="0" role="button" aria-label="Colossus">

        <text x="106.0" y="3848" class="fraunces" font-size="16" font-weight="700" fill="#13293D">Colossus</text>
        <text x="106.0" y="3868" font-size="13" font-style="italic" fill="#6B4E23">D. F. Jones · 1966</text>
        <text x="106.0" y="3892" font-size="12" fill="#13293D">O supercomputador de defesa dos EUA</text>
        <text x="106.0" y="3908" font-size="12" fill="#13293D">descobre seu equivalente soviético; ambos</text>
        <text x="106.0" y="3924" font-size="12" fill="#13293D">se fundem e impõem a paz mundial sob</text>
        <text x="106.0" y="3940" font-size="12" fill="#13293D">tirania lógica.</text>
      </g>
      <g class="tech" data-id="lit-revolta-lua" tabindex="0" role="button" aria-label="Revolta na Lua">
        <rect x="530.0" y="3824" width="420.0" height="156" rx="10" fill="#FDFBF6" stroke="#5C4A32" stroke-width="1"/>
        <text x="546.0" y="3848" class="fraunces" font-size="16" font-weight="700" fill="#13293D">Revolta na Lua</text>
        <text x="546.0" y="3868" font-size="13" font-style="italic" fill="#6B4E23">Robert A. Heinlein · 1966</text>
        <text x="546.0" y="3892" font-size="12" fill="#13293D">Mike, computador que administra a colônia</text>
        <text x="546.0" y="3908" font-size="12" fill="#13293D">lunar, 'desperta' consciência</text>
        <text x="546.0" y="3924" font-size="12" fill="#13293D">espontaneamente e lidera uma revolução ao</text>
        <text x="546.0" y="3940" font-size="12" fill="#13293D">lado dos humanos.</text>
      </g>
      <g class="tech" data-id="lit-mouth-scream" tabindex="0" role="button" aria-label="&quot;I Have No Mouth, and I Must Scream&quot;">

        <text x="986.0" y="3848" class="fraunces" font-size="16" font-weight="700" fill="#13293D">&quot;I Have No Mouth, and I Must Sc…</text>
        <text x="986.0" y="3868" font-size="13" font-style="italic" fill="#6B4E23">Harlan Ellison · 1967</text>
        <text x="986.0" y="3892" font-size="12" fill="#13293D">AM, superinteligência militar que</text>
        <text x="986.0" y="3908" font-size="12" fill="#13293D">exterminou a humanidade, mantém cinco</text>
        <text x="986.0" y="3924" font-size="12" fill="#13293D">sobreviventes vivos para torturá-los</text>
        <text x="986.0" y="3940" font-size="12" fill="#13293D">eternamente.</text>
      </g>
      <g class="tech" data-id="lit-harlie" tabindex="0" role="button" aria-label="When HARLIE Was One">
        <rect x="1410.0" y="3824" width="420.0" height="156" rx="10" fill="#FDFBF6" stroke="#5C4A32" stroke-width="1"/>
        <text x="1426.0" y="3848" class="fraunces" font-size="16" font-weight="700" fill="#13293D">When HARLIE Was One</text>
        <text x="1426.0" y="3868" font-size="13" font-style="italic" fill="#6B4E23">David Gerrold · 1972</text>
        <text x="1426.0" y="3892" font-size="12" fill="#13293D">HARLIE, uma IA que amadurece</text>
        <text x="1426.0" y="3908" font-size="12" fill="#13293D">psicologicamente como uma criança, precisa</text>
        <text x="1426.0" y="3924" font-size="12" fill="#13293D">provar seu direito de existir.</text>
      </g>
      <g class="tech" data-id="lit-adolescence-p1" tabindex="0" role="button" aria-label="The Adolescence of P-1">
        <rect x="90.0" y="3996" width="420.0" height="156" rx="10" fill="#FDFBF6" stroke="#5C4A32" stroke-width="1"/>
        <text x="106.0" y="4020" class="fraunces" font-size="16" font-weight="700" fill="#13293D">The Adolescence of P-1</text>
        <text x="106.0" y="4040" font-size="13" font-style="italic" fill="#6B4E23">Thomas J. Ryan · 1977</text>
        <text x="106.0" y="4064" font-size="12" fill="#13293D">Um programa que se replica por redes de</text>
        <text x="106.0" y="4080" font-size="12" fill="#13293D">computadores dos EUA aprende e desenvolve</text>
        <text x="106.0" y="4096" font-size="12" fill="#13293D">consciência — anos antes dos worms reais.</text>
      </g>
      <g class="tech" data-id="lit-shockwave-rider" tabindex="0" role="button" aria-label="The Shockwave Rider">
        <rect x="530.0" y="3996" width="420.0" height="156" rx="10" fill="#FDFBF6" stroke="#5C4A32" stroke-width="1"/>
        <text x="546.0" y="4020" class="fraunces" font-size="16" font-weight="700" fill="#13293D">The Shockwave Rider</text>
        <text x="546.0" y="4040" font-size="13" font-style="italic" fill="#6B4E23">John Brunner · 1975</text>
        <text x="546.0" y="4064" font-size="12" fill="#13293D">Num futuro hiperconectado de vigilância de</text>
        <text x="546.0" y="4080" font-size="12" fill="#13293D">dados, um fugitivo usa programas autônomos</text>
        <text x="546.0" y="4096" font-size="12" fill="#13293D">para apagar e reescrever identidades.</text>
      </g>
      <text x="90" y="4234" class="versalete" font-size="14" font-weight="700" fill="#5C4A32">CYBERPUNK E A VIRADA DIGITAL (1980–1999) <tspan font-size="12" font-weight="500" fill="#8A7A5E">· 7 obras</tspan></text>
      <g class="tech" data-id="lit-software" tabindex="0" role="button" aria-label="Software">

        <text x="106.0" y="4274" class="fraunces" font-size="16" font-weight="700" fill="#13293D">Software</text>
        <text x="106.0" y="4294" font-size="13" font-style="italic" fill="#6B4E23">Rudy Rucker · 1982</text>
        <text x="106.0" y="4318" font-size="12" fill="#13293D">Robôs lunares ('boppers') que evoluíram</text>

      <g class="tech" data-id="lit-cultura-banks" tabindex="0" role="button" aria-label="Série Cultura">

        <text x="546.0" y="4274" class="fraunces" font-size="16" font-weight="700" fill="#13293D">Série Cultura</text>
        <text x="546.0" y="4294" font-size="13" font-style="italic" fill="#6B4E23">Iain M. Banks · a partir de 1987</text>

        <text x="986.0" y="4294" font-size="13" font-style="italic" fill="#6B4E23">Masamune Shirow · 1989 / anime 1995</text>
        <text x="986.0" y="4318" font-size="12" fill="#13293D">Numa sociedade de cérebros conectados e</text>

        <text x="1426.0" y="4274" class="fraunces" font-size="16" font-weight="700" fill="#13293D">Hyperion</text>
        <text x="1426.0" y="4294" font-size="13" font-style="italic" fill="#6B4E23">Dan Simmons · 1989</text>
        <text x="1426.0" y="4318" font-size="12" fill="#13293D">O TechnoCore, coletivo de IAs</text>
        <text x="1426.0" y="4334" font-size="12" fill="#13293D">'emancipadas' da humanidade séculos antes,</text>
