<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>O Universo da Inteligência Artificial — Valorian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --marfim:#F7F3EB;
    --marfim-2:#FDFBF6;
    --navy-900:#0A1F33;
    --navy-800:#13293D;
    --navy-100:#E4E9EA;
    --navy-200:#C6D2DA;
    --navy-400:#6F8499;
    --navy-600:#33506B;
    --pedra:#C2C9D1;
    --grafite:#4A4F55;
    --dourado:#C9A227;
    --dourado-100:#F1E8D0;
    --muted:#5A6B7C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--marfim);font-family:'Inter',Arial,sans-serif;color:var(--navy-800);}
  .topbar{
    background:var(--navy-900);color:var(--marfim);
    padding:10px 20px;text-align:center;
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1.5px;
    border-bottom:3px solid var(--dourado);
  }
  .topbar b{color:var(--dourado);}
  .wrap{max-width:1920px;margin:0 auto;position:relative;}

  /* ===== ZOOM / PAN ===== */
  .zoom-stage{
    position:relative; width:100%; aspect-ratio:1920/2300;
    overflow:hidden; touch-action:none; cursor:grab;
    background:var(--marfim); border-bottom:1px solid #E7E2D5;
  }
  .zoom-stage.panning{cursor:grabbing;}
  .zoom-inner{position:absolute; top:0; left:0; width:100%; height:100%;}
  svg#chart{display:block; width:100%; height:100%;}

  #zoom-controls{
    position:fixed; right:18px; bottom:18px; z-index:50;
    display:flex; flex-direction:column; gap:6px;
    background:var(--navy-900); padding:6px; border-radius:14px;
    box-shadow:0 8px 22px rgba(10,31,51,.3); border:1px solid var(--dourado);
  }
  #zoom-controls button{
    width:38px; height:38px; border-radius:9px; border:none;
    background:rgba(247,243,235,.1); color:var(--marfim);
    font-size:18px; font-family:'Inter',sans-serif; font-weight:600;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .15s;
  }
  #zoom-controls button:hover{background:var(--dourado); color:var(--navy-900);}
  #zoom-reset{font-size:15px;}

  /* pills interativas */
  .tech{cursor:pointer;}
  .tech rect{transition:transform .15s ease, filter .15s ease, stroke-width .15s ease;}
  .tech text{pointer-events:none;}
  .tech:hover rect, .tech:focus-visible rect{
    filter:drop-shadow(0 3px 8px rgba(10,31,51,0.35));
    stroke-width:2.4;
  }
  .tech:focus-visible{outline:none;}
  .tech:focus-visible rect{stroke:var(--dourado); stroke-width:2.6;}
  .tech-gold:hover rect, .tech-gold:focus-visible rect{filter:drop-shadow(0 3px 10px rgba(201,162,39,0.55));}

  .catalog-cta{cursor:pointer;}
  .catalog-cta rect{transition:filter .15s ease, fill .15s ease;}
  .catalog-cta:hover rect, .catalog-cta:focus-visible rect{
    filter:drop-shadow(0 4px 14px rgba(201,162,39,.5));
  }
  .catalog-cta:focus-visible{outline:none;}

  /* hint flutuante */
  .hint{
    position:absolute; left:50%; transform:translateX(-50%);
    top:172px;
    background:var(--navy-900); color:var(--marfim);
    font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.5px;
    padding:7px 16px; border-radius:20px; border:1px solid var(--dourado);
    box-shadow:0 6px 18px rgba(10,31,51,.25);
    pointer-events:none; opacity:.95; z-index:5;
  }

  /* ===== MODAL ===== */
  #backdrop{
    position:fixed; inset:0; background:rgba(10,31,51,.55);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center;
    z-index:100; padding:24px;
  }
  #backdrop.open{display:flex;}
  #card{
    background:var(--marfim-2); width:100%; max-width:520px; max-height:86vh;
    border-radius:18px; overflow:hidden;
    box-shadow:0 24px 60px rgba(10,31,51,.45);
    display:flex; flex-direction:column;
    animation:pop .18s ease;
  }
  @keyframes pop{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
  #card-head{
    background:var(--navy-900); padding:22px 26px 18px; position:relative;
    border-bottom:3px solid var(--dourado);
  }
  #card-close{
    position:absolute; top:14px; right:14px;
    width:32px; height:32px; border-radius:50%;
    background:rgba(247,243,235,.12); border:none; color:var(--marfim);
    font-size:18px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #card-close:hover{background:rgba(247,243,235,.24);}
  #card-eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:1.8px;
    color:var(--dourado); text-transform:uppercase; margin:0 0 6px;
  }
  #card-title{
    font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:24px;
    color:var(--marfim); margin:0; line-height:1.15; padding-right:36px;
  }
  #card-era{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--marfim);
    opacity:.65; margin-top:8px;
  }
  #card-techniques{
    font-size:12px; color:var(--marfim); margin-top:8px; line-height:1.4;
  }
  #card-techniques b{color:var(--dourado); font-weight:600;}
  #card-body{padding:22px 26px 8px; overflow-y:auto;}
  #card-status{
    display:inline-flex; align-items:center; gap:7px;
    padding:6px 14px; border-radius:20px; font-size:12px; font-weight:600;
    margin-bottom:16px;
  }
  #card-status .dot{width:8px; height:8px; border-radius:50%;}
  .status-ativa{background:var(--dourado-100); color:#7A5E10; border:1px solid var(--dourado);}
  .status-ativa .dot{background:var(--dourado);}
  .status-nicho{background:var(--navy-100); color:var(--navy-800); border:1px solid var(--navy-400);}
  .status-nicho .dot{background:var(--navy-400);}
  .status-historica{background:#EDEBE6; color:var(--grafite); border:1px solid #A9AEB3;}
  .status-historica .dot{background:#8A8F94;}
  .status-fronteira{background:var(--marfim-2); color:var(--navy-800); border:1.5px dashed var(--dourado);}
  .status-fronteira .dot{background:var(--navy-800); box-shadow:0 0 0 3px var(--dourado-100);}
  .status-obra{background:#F0E6D2; color:#6B4E23; border:1px solid #B8956A;}
  .status-obra .dot{background:#B8956A;}

  #card-desc{font-size:15px; line-height:1.55; color:var(--navy-800); margin:0 0 18px;}
  #card-uses h4{
    font-family:'Inter',sans-serif; font-size:11px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--muted); margin:0 0 10px; font-weight:700;
  }
  #card-uses ul{margin:0 0 6px; padding:0; list-style:none;}
  #card-uses li{
    position:relative; padding:0 0 10px 20px; font-size:14px; line-height:1.45; color:var(--navy-800);
  }
  #card-uses li:before{
    content:"›"; position:absolute; left:0; top:-2px; color:var(--dourado); font-weight:700; font-size:17px;
  }
  #card-foot{
    padding:14px 26px 20px; font-size:11px; color:var(--muted); font-style:italic;
    border-top:1px solid #E7E2D5;
  }

  @media (max-width: 640px){
    #card-title{font-size:20px;}
    .hint{font-size:10px; padding:6px 12px; top:150px;}
  }

</style>
</head>

const SVGNS = "http://www.w3.org/2000/svg";

// Cor de preenchimento por classificação de uso (status), não mais por camada estrutural
const STATUS_STYLE = {
  ativa:     {fill:"#DFC067", stroke:"#13293D", sw:1,   textFill:"#13293D", dash:null},
  nicho:     {fill:"#6F8499", stroke:"#13293D", sw:1,   textFill:"#F7F3EB", dash:null},
  historica: {fill:"#E6E3DA", stroke:"#B9B2A3", sw:1,   textFill:"#4A4F55", dash:null},
  fronteira: {fill:"#FDFBF6", stroke:"#C9A227", sw:1.8, textFill:"#13293D", dash:"4 3"},
  obra:      {fill:"#D9C6A3", stroke:"#5C4A32", sw:1.2, textFill:"#3A2E1F", dash:null}
};

function styleFor(status){
  return STATUS_STYLE[status] || {fill:"#FDFBF6", stroke:"#13293D", sw:1.3, textFill:"#13293D", dash:null};
}

function renderPills(){
  const layer = document.getElementById("pills-layer");
  PILLS.forEach(p => {
    const clickId = p.linkId || p.id;
    const data = TECH[clickId];
    if (!data && p.variant !== "gold-label") { console.warn("Sem dados para:", clickId); }

    const g = document.createElementNS(SVGNS, "g");
    const isActive = data && data.status === "ativa";
    g.setAttribute("class", "tech" + (isActive ? " tech-gold" : ""));
    g.setAttribute("data-id", clickId);
    g.setAttribute("data-status", data ? data.status : "");
    if (p.variant !== "gold-label"){
      g.setAttribute("tabindex", "0");
      g.setAttribute("role", "button");
      g.setAttribute("aria-label", p.label);
    } else {
      g.style.pointerEvents = "none";
    }

    const st = styleFor(data ? data.status : null);

    if (p.variant !== "gold-label"){
      const rect = document.createElementNS(SVGNS, "rect");
      rect.setAttribute("x", p.x); rect.setAttribute("y", p.y);
      rect.setAttribute("width", p.w); rect.setAttribute("height", p.h);
      rect.setAttribute("rx", p.rx);
      rect.setAttribute("fill", st.fill);
      rect.setAttribute("stroke", st.stroke);
      rect.setAttribute("stroke-width", st.sw);
      if (st.dash) rect.setAttribute("stroke-dasharray", st.dash);
      g.appendChild(rect);
    }

    const text = document.createElementNS(SVGNS, "text");
    text.setAttribute("x", p.x + p.w/2);
    text.setAttribute("y", p.y + p.h/2 + (p.fs*0.35));
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("font-size", p.fs);
    text.setAttribute("fill", st.textFill);
    if (p.bold) text.setAttribute("font-weight", "600");
    text.textContent = p.label;
    g.appendChild(text);

    if (p.sub){
      const sub = document.createElementNS(SVGNS, "text");
      sub.setAttribute("x", p.x + p.w/2);
      sub.setAttribute("y", p.y + p.h - 6);
      sub.setAttribute("text-anchor", "middle");
      sub.setAttribute("font-size", 8.5);
      sub.setAttribute("fill", st.textFill);
      sub.textContent = p.sub;
      g.appendChild(sub);
    }

    if (p.variant !== "gold-label"){
      g.addEventListener("click", () => openCard(clickId));
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openCard(clickId); }});
    }
    layer.appendChild(g);
  });
}

const backdrop = document.getElementById("backdrop");
const elEyebrow = document.getElementById("card-eyebrow");
const elTitle = document.getElementById("card-title");
const elEra = document.getElementById("card-era");
const elTechniques = document.getElementById("card-techniques");
const elStatus = document.getElementById("card-status");
const elStatusLabel = document.getElementById("card-status-label");
const elDesc = document.getElementById("card-desc");
const elUsesList = document.getElementById("card-uses-list");
const elUsesHeading = document.getElementById("card-uses-heading");

function openCard(id){
  const d = TECH[id];
  if (!d) return;
  elEyebrow.textContent = d.group;
  elTitle.textContent = d.name;
  elEra.textContent = d.era;
  elUsesHeading.textContent = (d.status === "obra") ? "Legado na IA real" : "Casos de uso";
  if (d.techniques){
    elTechniques.innerHTML = "<b>Técnicas mais usadas:</b> " + d.techniques;
    elTechniques.style.display = "block";
  } else {
    elTechniques.textContent = "";
    elTechniques.style.display = "none";
  }
  elStatus.className = "status-" + d.status;
  elStatusLabel.textContent = d.statusLabel;
  elDesc.textContent = d.desc;
  elUsesList.innerHTML = "";
  d.uses.forEach(u => {
    const li = document.createElement("li");
    li.textContent = u;
    elUsesList.appendChild(li);
  });
  backdrop.classList.add("open");
  document.getElementById("card-close").focus();
}
function closeCard(){
  backdrop.classList.remove("open");
}
document.getElementById("card-close").addEventListener("click", closeCard);
backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeCard(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeCard(); });

renderPills();

function dismissHint(){ const h=document.querySelector(".hint"); if(h){ h.style.transition="opacity .3s"; h.style.opacity="0"; } clearTimeout(hintTimer); }

// ===== ZOOM / PAN (manipula o viewBox do SVG — mantém nitidez vetorial em qualquer zoom) =====
(function(){
  const stage = document.getElementById("zoom-stage");
  const chart = document.getElementById("chart");
  const BASE_W = 1920, BASE_H = 2300;
  const MAX_ZOOM = 6;
  // fitW/fitH = tamanho do "encaixe de cobertura" (viewBox na proporção do contêiner atual,
  // sem letterbox nem depender do preserveAspectRatio do navegador). zoom=1 = totalmente
  // afastado (mostra o encaixe de cobertura); zoom>1 amplia proporcionalmente a partir dali.
  const state = {fitW:BASE_W, fitH:BASE_H, zoom:1, offsetX:0, offsetY:0};
  const pointers = new Map();
  let isPanning = false, dragMoved = false, panStart = null;
  let pinchStartDist = 0, pinchStartZoom = 1;
  let rafId = null;
  let hasInteracted = false;

  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

  function currentViewSize(){
    return { w: state.fitW/state.zoom, h: state.fitH/state.zoom };
  }

  function clampOffsets(viewW, viewH, offX, offY){
    return {
      x: clamp(offX, 0, Math.max(0, BASE_W - viewW)),
      y: clamp(offY, 0, Math.max(0, BASE_H - viewH))
    };
  }

  function applyViewBox(){
    const {w, h} = currentViewSize();
    chart.setAttribute("viewBox", `${state.offsetX} ${state.offsetY} ${w} ${h}`);
  }

  // ponto da tela (px,py relativos ao stage) -> coordenada no espaço do SVG (unidades do viewBox)
  function toSvgUser(px, py, rect, viewW, viewH){
    return {
      x: state.offsetX + (px/rect.width) * viewW,
      y: state.offsetY + (py/rect.height) * viewH
    };
  }

  function zoomAt(px, py, newZoom){
    if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
    newZoom = clamp(newZoom, 1, MAX_ZOOM);
    const rect = stage.getBoundingClientRect();
    const cur = currentViewSize();
    const user = toSvgUser(px, py, rect, cur.w, cur.h);
    const viewWNew = state.fitW/newZoom, viewHNew = state.fitH/newZoom;
    let offX = user.x - (px/rect.width) * viewWNew;
    let offY = user.y - (py/rect.height) * viewHNew;
    const clamped = clampOffsets(viewWNew, viewHNew, offX, offY);
    state.zoom = newZoom; state.offsetX = clamped.x; state.offsetY = clamped.y;
    applyViewBox();
  }

  function panBy(dxPx, dyPx, rect){
    const cur = currentViewSize();
    const dxUser = (dxPx/rect.width) * cur.w;
    const dyUser = (dyPx/rect.height) * cur.h;
    const clamped = clampOffsets(cur.w, cur.h, panStart.offX - dxUser, panStart.offY - dyUser);
    state.offsetX = clamped.x; state.offsetY = clamped.y;
    applyViewBox();
  }

  // zoom animado (para botões, duplo clique/toque e reset) — interpola zoom + offsets via rAF
  function animateZoomAt(px, py, targetZoom, duration){
    if (rafId){ cancelAnimationFrame(rafId); }
    duration = duration || 220;
    targetZoom = clamp(targetZoom, 1, MAX_ZOOM);
    const rect = stage.getBoundingClientRect();
    const cur = currentViewSize();
    const user = toSvgUser(px, py, rect, cur.w, cur.h);
    const viewWEnd = state.fitW/targetZoom, viewHEnd = state.fitH/targetZoom;
    const targetRaw = {
      x: user.x - (px/rect.width) * viewWEnd,
      y: user.y - (py/rect.height) * viewHEnd
    };
    const target = clampOffsets(viewWEnd, viewHEnd, targetRaw.x, targetRaw.y);
    const startZoom = state.zoom, startX = state.offsetX, startY = state.offsetY;
    const t0 = performance.now();
    function frame(now){
      const t = Math.min(1, (now - t0) / duration);
      const ease = 1 - Math.pow(1 - t, 3);
      state.zoom = startZoom + (targetZoom - startZoom) * ease;
      state.offsetX = startX + (target.x - startX) * ease;
      state.offsetY = startY + (target.y - startY) * ease;
      applyViewBox();
      if (t < 1){ rafId = requestAnimationFrame(frame); }
      else { state.zoom = targetZoom; state.offsetX = target.x; state.offsetY = target.y; applyViewBox(); rafId = null; }
    }
    rafId = requestAnimationFrame(frame);
  }

  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function mid(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }
  function toStageLocal(clientX, clientY){
    const rect = stage.getBoundingClientRect();
    return {x: clientX - rect.left, y: clientY - rect.top};
  }

  stage.addEventListener("pointerdown", (e) => {
    dismissHint();
    hasInteracted = true;
    if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pointers.size === 1){
      isPanning = true; dragMoved = false;
      panStart = {x:e.clientX, y:e.clientY, offX:state.offsetX, offY:state.offsetY};
      stage.classList.add("panning");
    } else if (pointers.size === 2){
      isPanning = false;
      const pts = Array.from(pointers.values());
      pinchStartDist = dist(pts[0], pts[1]);
      pinchStartZoom = state.zoom;
    }
  });

  window.addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if (pointers.size === 1 && isPanning){
      const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
      if (Math.hypot(dx,dy) > 6) dragMoved = true;
      const rect = stage.getBoundingClientRect();
      panBy(dx, dy, rect);
    } else if (pointers.size === 2){
      dragMoved = true;
      const pts = Array.from(pointers.values());
      const d = dist(pts[0], pts[1]);
      const newMid = mid(pts[0], pts[1]);
      const local = toStageLocal(newMid.x, newMid.y);
      const newZoom = pinchStartZoom * (d / pinchStartDist);
      zoomAt(local.x, local.y, newZoom);
    }
  });

  function endPointer(e){
    pointers.delete(e.pointerId);
    if (pointers.size === 0){
      isPanning = false;
      stage.classList.remove("panning");
    } else if (pointers.size === 1){
      const remaining = Array.from(pointers.entries())[0];
      isPanning = true;
      panStart = {x:remaining[1].x, y:remaining[1].y, offX:state.offsetX, offY:state.offsetY};
    }
  }
  window.addEventListener("pointerup", endPointer);
  window.addEventListener("pointercancel", endPointer);

  // impede que um arraste dispare o clique de uma pill
  stage.addEventListener("click", (e) => {
    if (dragMoved){ e.stopPropagation(); dragMoved = false; }
  }, true);

  // duplo clique / duplo toque para zoom rápido
  stage.addEventListener("dblclick", (e) => {
    dismissHint();
    hasInteracted = true;
    const local = toStageLocal(e.clientX, e.clientY);
    if (state.zoom > 1.5){
      animateZoomAt(local.x, local.y, 1);
    } else {
      animateZoomAt(local.x, local.y, 2.4);
    }
  });

  // botões de controle
  document.getElementById("zoom-in").addEventListener("click", () => {
    hasInteracted = true;
    const rect = stage.getBoundingClientRect();
    animateZoomAt(rect.width/2, rect.height/2, state.zoom * 1.4);
  });
  document.getElementById("zoom-out").addEventListener("click", () => {
    hasInteracted = true;
    const rect = stage.getBoundingClientRect();
    animateZoomAt(rect.width/2, rect.height/2, state.zoom / 1.4);
  });
  document.getElementById("zoom-reset").addEventListener("click", () => {
    hasInteracted = true;
    const rect = stage.getBoundingClientRect();
    animateZoomAt(rect.width/2, rect.height/2, 1);
  });

  // ===== encaixe de cobertura: recalcula fitW/fitH (proporção do contêiner atual) =====
  // fitW/fitH sempre casam com a proporção da tela — é isso que evita tanto barras vazias
  // quanto recorte "preso": como o pan trabalha nas mesmas unidades, arrastar sempre
  // alcança qualquer borda real do conteúdo (0 e 1920 em x, 0 e 1800 em y).
  function refit(forceReset){
    const rect = stage.getBoundingClientRect();
    if (rect.width < 2 || rect.height < 2) return; // stage oculto (ex.: acordeão mobile ativo)
    const coverScale = Math.max(rect.width/BASE_W, rect.height/BASE_H);
    const newFitW = rect.width/coverScale, newFitH = rect.height/coverScale;
    state.fitW = newFitW; state.fitH = newFitH;
    if (forceReset || !hasInteracted){
      state.zoom = 1;
      state.offsetX = clamp((BASE_W - newFitW)/2, 0, Math.max(0, BASE_W-newFitW));
      state.offsetY = clamp((BASE_H - newFitH)/2, 0, Math.max(0, BASE_H-newFitH));
    } else {
      const cur = currentViewSize();
      const c = clampOffsets(cur.w, cur.h, state.offsetX, state.offsetY);
      state.offsetX = c.x; state.offsetY = c.y;
    }
    applyViewBox();
  }

  // altura do stage: sempre governada pela proporção 1920×2300 (aspect-ratio no CSS)
  function fitStageHeight(){
    stage.style.height = "";
  }

  function refitAll(forceReset){
    fitStageHeight();
    refit(forceReset);
  }
  refitAll(true);
  window.addEventListener("resize", () => refitAll(false));
  window.addEventListener("orientationchange", () => refitAll(true));
  window.fitStageHeight = () => refitAll(true);
})();
